<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a4a86"/>
      <stop offset="55%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#002a52"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8b86a"/>
      <stop offset="100%" stop-color="#9d7e4e"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- dual-stream: two inputs merging into one compact latent (right node) -->
  <!-- semantic stream (top, gold) -->
  <circle cx="15" cy="20" r="5.2" fill="url(#gold)"/>
  <!-- pixel stream (bottom, white) -->
  <circle cx="15" cy="44" r="5.2" fill="#ffffff"/>
  <!-- fused latent node (right, gold ring) -->
  <circle cx="48" cy="32" r="6.5" fill="#ffffff"/>
  <circle cx="48" cy="32" r="6.5" fill="none" stroke="url(#gold)" stroke-width="2.5"/>

  <!-- connecting paths (fusion) -->
  <path d="M19.5 22 C 33 26, 36 30, 42.5 31" fill="none" stroke="#d8b86a" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M19.5 42 C 33 38, 36 34, 42.5 33" fill="none" stroke="#cfe0f0" stroke-width="2.6" stroke-linecap="round"/>
</svg>
